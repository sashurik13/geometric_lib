name: Run Unit Tests on Push

on:
  push:
    branches: [ "main", "new_features_501709" ]
  pull_request:
    branches: [ "new_features_501709" ]

  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run unit tests
      run: |
        python -m pytest tests/ -v
